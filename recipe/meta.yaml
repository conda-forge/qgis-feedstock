{% set version = "4.2.3" %}

package:
  name: qgis
  version: {{ version }}

source:
  url: https://qgis.org/downloads/qgis-{{ version }}.tar.bz2
  sha256: b044889d895c07d9355512cba76973822830153f6f15feb0d5e00077d3d76e59
  patches:
    - 0001-fix-protobuf-23.patch
    - 0002-skip-dot-in-path.patch  # [win]
    - 0005-check-locks-not-destroyed.patch
    - 0006-use-entrypoints.patch
    # fix segfault on import qgis.core on OSX (link extension modules
    # against Python::Module, not Python::Python / libpython)
    - 0007-link-python-module.patch  # [osx]
    # OpenCL 1.2 target on OSX is incompatible with conda-forge's
    # khronos-opencl-icd-loader (OpenCL 3.0); see the patch for details.
    - 0008-macos-opencl-target-version.patch  # [osx]
    # clhpp's opencl.hpp/cl2.hpp don't build with libc++ in C++20 mode
    # (KhronosGroup/OpenCL-CLHPP#167); conda-forge's clhpp 2.0.16 predates
    # the fix, so on OSX use QGIS's bundled copy with the fix applied.
    - 0009-fix-clhpp-libcxx-cxx20.patch  # [osx]
    # let bld.bat point sip-build at Library/bin/qmake6.exe, the qmake that
    # has a working qt6.conf on Windows
    - 0010-allow-qmake-executable-override.patch  # [win]
    # build.sh uses -DQGIS_MAC_BUNDLE=FALSE; the .icns install needs the
    # bundle's APP_RESOURCES_DIR, so skip it without a bundle
    - 0011-mac-icons-only-in-bundle.patch  # [osx]

build:
  number: 0
  # pyproj no longer supports py311
  skip: true  # [py2k or py<312]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cmake
    - ninja
    - m2-flex  # [win]
    - m2-bison  # [win]
    - m2-m4  # [win]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - sip                                # [build_platform != target_platform]
    - pyqt-builder                       # [build_platform != target_platform]
    - pyqt6-sip                          # [build_platform != target_platform]
    - pyqt6                              # [build_platform != target_platform]
    - qscintilla2                        # [build_platform != target_platform]
    - pkgconfig                          # [build_platform != target_platform]
    - flex                               # [unix and (build_platform != target_platform)]
    - bison                              # [unix and (build_platform != target_platform)]
    - m4                                 # [unix and (build_platform != target_platform)]
    - libpdal                            # [build_platform != target_platform]
    - libprotobuf                        # [build_platform != target_platform]
  host:
    - setuptools
    - sip
    - python                             # [build_platform == target_platform]
    - six
    - flex                               # [unix]
    - bison                              # [unix]
    - m4                                 # [unix]
    - pkgconfig
    - expat
    - icu
    - libzip
    - libprotobuf
    - libtasn1                           # [osx]
    - exiv2
    # Qt stack.
    - qt6-main
    - pyqt6                              # [build_platform == target_platform]
    - pyqt6-sip                          # [build_platform == target_platform]
    - pyqt-builder                       # [build_platform == target_platform]
    # qt6-webengine isn't published for osx-64 (Intel); qt-webengine-feedstock
    # cross-compiles it from osx-arm64 and Chromium can't cross-compile that way.
    # https://github.com/conda-forge/qt-webengine-feedstock/pull/98
    - qt6-webengine                      # [not (osx and x86_64)]
    - qt6-serialport
    - qt6-multimedia
    - qt6-positioning
    - qt6-3d
    - qscintilla2
    - qca-qt6
    - qwt
    - qtkeychain-qt6
    # GDAL stack.
    - libgdal
    - gdal
    - geos
    - proj
    # GSL for georeferencer.
    - gsl
    - sqlite
    - libspatialindex 2.0
    - libspatialite
    # For PostgreSQL support.
    - postgresql
    - psycopg2
    # Point Clouds. Need only C/C++ package
    - libpdal
    # no laz-perf: QGIS builds its own copy (WITH_INTERNAL_LAZPERF, default
    # on), which needs internal headers the conda package doesn't ship, and
    # the conda headers clash with it on Windows' include order
    - libopencl-devel
    - clhpp
    - libgl-devel                            # [linux]
    - libegl-devel                           # [linux]
    - libopengl-devel                        # [linux]
    - xorg-xorgproto                         # [linux]
    - xcb-util                               # [linux]
    - xcb-util-wm                            # [linux]
    - xcb-util-keysyms                       # [linux]
    - xcb-util-image                         # [linux]
    - xcb-util-renderutil                    # [linux]
    - xorg-libx11                            # [linux]
    - xorg-libxext                           # [linux]
    - xorg-libxdamage                        # [linux]
    - xorg-libsm                             # [linux]
    - xorg-libice                            # [linux]
    - xorg-libxcomposite                     # [linux]
    - xorg-libxxf86vm                        # [linux]
    - xorg-xf86vidmodeproto                  # [linux]
  run:
    - python
    - icu
    - libzip
    - libtasn1                               # [osx]
    - qt6-main
    - pyqt6
    - pyqt6-sip
    # qt6-webengine isn't published for osx-64 (Intel); qt-webengine-feedstock
    # cross-compiles it from osx-arm64 and Chromium can't cross-compile that way.
    # https://github.com/conda-forge/qt-webengine-feedstock/pull/98
    - qt6-webengine                      # [not (osx and x86_64)]
    - qt6-serialport
    - qt6-multimedia
    - qt6-positioning
    - qt6-3d
    - qscintilla2
    - qca-qt6
    - qwt
    - qtkeychain-qt6
    - libgdal
    - gdal
    - geos
    - proj
    - gsl
    - sqlite
    - libspatialindex 2.0
    - libspatialite
    - psycopg2
    - postgresql
    - exiv2
    - libprotobuf
    # Runtime Python library deps
    - python-dateutil
    - future
    - httplib2
    - jinja2
    - markupsafe
    - mock
    - nose2
    - plotly
    - pygments
    - pyproj
    - requests
    - six
    - pytz
    - pyyaml
    - yaml
    - owslib
    - libpdal
    - ocl-icd                                # [linux]
    - khronos-opencl-icd-loader              # [win or osx]

test:
  files:
    - test_data
    - test_py_qgis.py
  commands:
    - {{ RECIPE_DIR }}/run_test.bat          # [win]
    - bash {{ RECIPE_DIR }}/run_test.sh      # [not win]

about:
  home: http://qgis.org/
  license: GPL-2.0-only
  license_file: COPYING
  summary: A free and open source Geographic Information System (GIS).
  description: |
    QGIS is a user friendly Open Source Geographic Information System (GIS)
    licensed under the GNU General Public License. QGIS is an official
    project of the Open Source Geospatial Foundation (OSGeo). It runs on
    Linux, Unix, Mac OSX, Windows and Android and supports numerous vector,
    raster, and database formats and functionalities.
  doc_url: https://www.qgis.org/en/docs/index.html
  dev_url: https://github.com/qgis/QGIS

extra:
  recipe-maintainers:
    - ceholden
    - ocefpaf
    - kmuehlbauer
    - SrNetoChan
    - gillins
    - izahn
